<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development | Hadil M. Hassan</title>
        <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* سحب نفس المتغيرات من كودك */
        :root {
            --gold: #d4af37;
            --bg: #050505;
            --card-bg: #111;
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 60px 20px;
            animation: fadeIn 1.2s ease;
        }

        /* تنسيق زر العودة بستايل الـ btn اللي عندك */
        .back-btn {
            display: inline-block;
            padding: 10px 30px;
            border: 2px solid var(--gold);
            color: var(--gold);
            text-decoration: none;
            border-radius: 50px;
            margin-bottom: 40px;
            transition: 0.4s;
            font-size: 0.9rem;
        }
        .back-btn:hover {
            background: var(--gold);
            color: #fff;
            box-shadow: 0 0 20px var(--gold);
        }

        .section-title {
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        /* كارت الشهادة بنفس ستايل الـ card عندك */
        .cert-display {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid #222;
            margin: 40px 0;
            transition: 0.4s;
        }
        .cert-display:hover {
            border-color: var(--gold);
            transform: scale(1.02);
        }

        .cert-img {
            width: 100%;
            max-width: 700px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .project-detail {
            text-align: left;
            background: rgba(212, 175, 55, 0.05);
            padding: 40px;
            border-radius: 20px;
            border-left: 5px solid var(--gold);
            margin-top: 50px;
        }

        .project-detail i {
            color: var(--gold);
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .github-link {
            color: var(--gold);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px solid var(--gold);
            padding-bottom: 2px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <nav class="back-nav"><a href="index.html">~/back-to-home</a></nav>
        <header>
            <h1>Web Development</h1>
            <span class="tagline">Full-Stack • Django • UI/UX</span>
        </header>
        <section class="main-content">
            <div class="cert-card">
                <img src="assets/web-cert.jpg" alt="CS50W Certificate">
                <p style="margin-top: 10px; font-family: 'Fira Code'; font-size: 0.8rem;">[ Certification: CS50_WEB ]</p>
            </div>
            <div class="project-box">
                <h3>Full-Stack E-Commerce Engine</h3>
                <p>Designed a dynamic auction platform using Django, featuring real-time bidding, user watchlists, and a responsive interface.</p>
                <div class="tech-stack"><span>Python</span><span>Django</span><span>JavaScript</span></div>
                <a href="#" class="btn-action">run-source-code</a>
            </div>
        </section>
    </div>
</body>
</html>
