<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Development | Hadil M. Hassan</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* كود الستايل من صورتك تماماً */
        :root { --gold: #d4af37; --bg: #050505; --card-bg: #111; }
        body { background-color: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; text-align: center; }
        .container { max-width: 1000px; margin: 0 auto; padding: 60px 20px; animation: fadeIn 1.2s ease; }
        .back-btn { display: inline-block; padding: 10px 30px; border: 2px solid var(--gold); color: var(--gold); text-decoration: none; border-radius: 50px; margin-bottom: 40px; transition: 0.4s; font-size: 0.9rem; }
        .back-btn:hover { background: var(--gold); color: #fff; box-shadow: 0 0 20px var(--gold); }
        .section-title { color: var(--gold); text-transform: uppercase; letter-spacing: 2px; font-size: 2.5rem; margin-bottom: 10px; }
        .cert-display { background: var(--card-bg); padding: 30px; border-radius: 20px; border: 1px solid #222; margin: 40px 0; transition: 0.4s; }
        .cert-display:hover { border-color: var(--gold); transform: scale(1.02); }
        .cert-img { width: 100%; max-width: 700px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .project-detail { text-align: left; background: rgba(212, 175, 55, 0.05); padding: 40px; border-radius: 20px; border-left: 5px solid var(--gold); margin-top: 50px; }
        .project-detail i { color: var(--gold); font-size: 2rem; margin-bottom: 20px; }
        .github-link { color: var(--gold); text-decoration: none; font-weight: 600; border-bottom: 1px solid var(--gold); padding-bottom: 2px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>
        <h1 class="section-title">Web Development</h1>
        <div class="cert-display">
            <img src="assets/web-cert.jpg" alt="Web Certificate" class="cert-img">
        </div>
        <div class="project-detail">
            <i class="fas fa-code"></i>
            <h3>Full-Stack Commerce Engine</h3>
            <p>Developing robust web applications using Django and JavaScript, focusing on secure authentication and dynamic user interfaces.</p>
            <a href="#" class="github-link">View Repository</a>
        </div>
    </div>
</body>
</html>
